name: Verified candidate package isolation

on:
  push:
    branches:
      - experiment/7250-hosted-build

permissions:
  contents: read

jobs:
  package-isolation:
    runs-on: ubuntu-24.04
    container:
      image: rockylinux:8
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUSTFLAGS: -C debuginfo=0
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y gcc gcc-c++ make pkgconf-pkg-config dbus-devel \
            openssl-devel cmake perl-core python3 git curl tar gzip \
            xz-devel zlib-devel
          dnf clean all
      - uses: actions/checkout@v4
        with:
          ref: 750eedb774f6c1d43d6689afb7abbd18844968da
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: List published crate files
        run: |
          git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD > package-source-sha.txt
          cargo package --list --locked -p codewhale-engine > package-list.txt
          ! grep -q 'operate_best_of_n.workflow.js' package-list.txt
          ! grep -q 'verified_candidate/tests.rs' package-list.txt
      - name: Compile published file set without repository Workflow file
        run: |
          set -o pipefail
          isolated=$(mktemp -d /tmp/cw7250-package.XXXXXX)
          git -c safe.directory="$GITHUB_WORKSPACE" archive HEAD | tar -x -C "$isolated"
          python3 - "$GITHUB_WORKSPACE/crates/engine" "$isolated/crates/engine" package-list.txt <<'PY'
          import pathlib, shutil, sys
          source, destination, listing = map(pathlib.Path, sys.argv[1:])
          assert str(destination).startswith('/tmp/cw7250-package.')
          shutil.rmtree(destination)
          for line in listing.read_text().splitlines():
              relative = pathlib.PurePosixPath(line)
              assert not relative.is_absolute() and '..' not in relative.parts
              original = source.joinpath(*relative.parts)
              if not original.is_file():
                  assert line in {'.cargo_vcs_info.json', 'Cargo.lock', 'Cargo.toml.orig'}, line
                  continue
              target = destination.joinpath(*relative.parts)
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(original, target)
          PY
          rm "$isolated/workflows/operate_best_of_n.workflow.js"
          test ! -e "$isolated/workflows/operate_best_of_n.workflow.js"
          (cd "$isolated" && cargo check --locked -p codewhale-engine --lib) 2>&1 | tee package-isolated-check.log
      - name: Preserve package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-candidate-isolated-package-evidence
          path: |
            package-source-sha.txt
            package-list.txt
            package-isolated-check.log
          if-no-files-found: warn
          retention-days: 7
