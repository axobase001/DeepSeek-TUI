name: R3 CLI evidence build

on:
  push:
    branches:
      - experiment/r3-hosted-build-7262

permissions:
  contents: read

jobs:
  build-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUSTFLAGS: -C debuginfo=0
    steps:
      - name: Check out the exact Draft PR source
        uses: actions/checkout@v4
        with:
          ref: 0bcd0685d06b73bd594ee882d690d8005509e264
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: bash scripts/ci-apt-install.sh libdbus-1-dev pkg-config
      - name: Keep runner disk within bounds
        run: bash scripts/prepare-ubuntu-build-headroom.sh
      - name: Build complete CodeWhale CLI
        run: cargo build --locked -p codewhale-cli
      - name: Record exact source and binary identity
        run: |
          {
            git rev-parse HEAD
            rustc -Vv
            cargo -V
            sha256sum target/debug/codewhale
            df -h .
          } > r3_cli_build_receipt.txt
      - name: Preserve executable and build receipt
        uses: actions/upload-artifact@v4
        with:
          name: codewhale-r3-cli-0bcd0685
          path: |
            target/debug/codewhale
            r3_cli_build_receipt.txt
          if-no-files-found: error
          retention-days: 7
