name: Verified candidate evidence build

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/7250-hosted-build

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 51c9071556279a68500f0ee896c9635e4a282487
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: git diff --binary > evaluator-rustfmt.patch
      - uses: actions/upload-artifact@v4
        with:
          name: evaluator-rustfmt-patch
          path: evaluator-rustfmt.patch
          if-no-files-found: error
          retention-days: 7

  linux:
    if: ${{ !contains(github.event.head_commit.message, 'formatting patch') }}
    runs-on: ubuntu-24.04
    container:
      image: rockylinux:8
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTFLAGS: -C debuginfo=0
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y gcc gcc-c++ make pkgconf-pkg-config dbus-devel \
            openssl-devel cmake perl-core python3 git curl tar gzip \
            xz-devel zlib-devel
          dnf clean all
      - uses: actions/checkout@v4
        with:
          ref: 51c9071556279a68500f0ee896c9635e4a282487
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Build full CLI
        run: cargo build --locked -p codewhale-cli
      - name: Run focused Rust tests
        run: cargo test --locked -p codewhale-engine verified_candidate --lib -- --nocapture
      - name: Record binary and test identity
        run: |
          git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD > evaluator-build-receipt.txt
          rustc -Vv >> evaluator-build-receipt.txt
          cargo -V >> evaluator-build-receipt.txt
          getconf GNU_LIBC_VERSION >> evaluator-build-receipt.txt
          sha256sum target/debug/codewhale >> evaluator-build-receipt.txt
          test_binary=$(find target/debug -type f -name 'codewhale_engine-*' -perm /111 -print -quit)
          test -n "$test_binary"
          cp "$test_binary" evaluator-engine-tests
          sha256sum evaluator-engine-tests >> evaluator-build-receipt.txt
          df -h . >> evaluator-build-receipt.txt
      - name: Preserve native binaries and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-candidate-linux-binaries
          path: |
            target/debug/codewhale
            evaluator-engine-tests
            evaluator-build-receipt.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Check evaluator crates
        run: cargo check --locked -p codewhale-engine -p codewhale-workflow-js -p codewhale-sandbox
      - name: List packaged engine files
        run: cargo package --list --locked -p codewhale-engine > evaluator-package-list.txt
      - name: Verify packaged engine independently
        run: |
          set -o pipefail
          cargo package --locked -p codewhale-engine 2>&1 | tee evaluator-package-verify.log
      - name: Preserve package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-candidate-package-evidence
          path: |
            evaluator-package-list.txt
            evaluator-package-verify.log
          if-no-files-found: warn
          retention-days: 7
      - name: Lint evaluator crates
        run: cargo clippy --locked -p codewhale-engine -p codewhale-workflow-js -p codewhale-sandbox --lib -- -D warnings

  macos:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUSTFLAGS: -C debuginfo=0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 51c9071556279a68500f0ee896c9635e4a282487
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Check engine and sandbox on macOS
        run: cargo check --locked -p codewhale-engine -p codewhale-sandbox
      - name: Lint engine and sandbox on macOS
        run: cargo clippy --locked -p codewhale-engine -p codewhale-sandbox --lib -- -D warnings

  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUSTFLAGS: -C debuginfo=0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 51c9071556279a68500f0ee896c9635e4a282487
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Check engine and sandbox on Windows
        run: cargo check --locked -p codewhale-engine -p codewhale-sandbox
      - name: Run focused evaluator tests on Windows
        run: cargo test --locked -p codewhale-engine verified_candidate --lib -- --nocapture
